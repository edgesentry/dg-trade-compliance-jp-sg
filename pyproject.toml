[project]
name = "dg-compliance"
version = "0.1.0"
description = "DG Trade Compliance JP–SG — Multimodal Extract (LiteLLM) and Neuro-Symbolic MVP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm[proxy]>=1.55.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dg-compliance = "dg_compliance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dg_compliance"]

# Map src/ layout so import is `dg_compliance`, not `src.dg_compliance`
[tool.hatch.build.targets.wheel.sources]
"src/dg_compliance" = "dg_compliance"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
