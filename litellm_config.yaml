# LiteLLM Proxy config — Gemini / OpenAI / Anthropic
# Start: ./scripts/start_litellm.sh
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # Default extract model (alias + full id)
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini/gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-sonnet-4-20250514
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  # request_timeout: 600

general_settings:
  # Local-only master key (override with LITELLM_MASTER_KEY in .env if set via CLI).
  # Clients: Authorization: Bearer sk-dg-local
  master_key: sk-dg-local
